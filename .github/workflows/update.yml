name: Generate update.xml for Sparkle

on:
  # push:
  #   branches: ["debug-update"]
  workflow_dispatch:
  workflow_call:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest
    env:
      # GitHub retains artifacts from earlier attempts of the same run.
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Parse Version
        run: |
          Version=$(grep "EMACSCTL_VERSION =" version.xcconfig | head -1 | sed -n 's/.*= \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p')
          echo "Version=$Version" >> $GITHUB_ENV
      - name: Generate update.xml
        run: |
          mkdir update
          cat << EOF > update/update.xml
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>EmacsCtl</title>
              <item>
                <title>Version ${{ env.Version }}</title>
                <pubDate>$(date)</pubDate>
                <sparkle:version>${{ env.Version }}</sparkle:version>
                <enclosure url="https://github.com/tctony-labs/EmacsCtl/releases/download/v${{ env.Version }}/EmacsCtl-v${{ env.Version }}.dmg" type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          # Upload entire repository
          path: 'update'
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          max_checks=3
          for ((attempt = 1; attempt <= max_checks; attempt++)); do
            artifact_count=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT_NAME" --jq '.total_count')
            if [[ "$artifact_count" == 1 ]]; then
              echo "Pages artifact $PAGES_ARTIFACT_NAME is visible."
              exit 0
            fi
            if (( attempt == max_checks )); then
              break
            fi
            echo "Pages artifact is not visible (check $attempt/$max_checks). Waiting 5 seconds."
            sleep 5
          done
          echo "::error::$PAGES_ARTIFACT_NAME did not appear after $max_checks checks."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
